# Typed surface: the tokenizer stages and the Step 1 diagnostic, and nothing
# else yet.
#
# recur predates any annotation discipline -- `from __future__
# import annotations` everywhere, return types on about half the functions, bare
# `dict` and `np.ndarray` rather than parameterised generics -- and would not
# pass `--strict` without a rewrite that has nothing to do with this stage.
# Widening the surface is its own change; silencing the checker to make a wide
# surface green is not.
[mypy]
python_version = 3.11
strict = True
files = vieb/seg, vieb/tok, vieb/qc, vieb/audit, vieb/clean, vieb/seeds.py, vieb/checks.py

# recur is on PYTHONPATH, not pip-installed, so mypy needs telling where its
# source is. Pointed at the source rather than silenced with
# `ignore_missing_imports`, because that would turn `Read` into `Any` and quietly
# retire the one typed boundary this config exists to keep. Hardcoded: mypy.ini
# does not expand environment variables, so VIEB_RECUR cannot reach it.
mypy_path = /home/tul26194/recur
show_error_codes = True
warn_unused_configs = True

# The rest of recur is untyped and is imported by the typed modules. Following
# those imports would report every one of their functions as untyped, which is
# true, already known, and not a finding about this stage.
follow_imports = silent

# recur's utility layer is imported, not forked. `read.py` is the one hard
# typed boundary -- it carries the verdict vocabulary every result speaks.
[mypy-recur.read]
follow_imports = normal

# sklearn ships no stubs and no py.typed marker. Unlike scipy there is no
# maintained stub package pinned to the version this repo uses, so the import is
# untyped by declaration rather than by oversight. Only the two regressor arms in
# `tok/parity.py` touch it, and they are reported rather than gated.
[mypy-sklearn.*]
ignore_missing_imports = True

# anipose ships no stubs and no py.typed. Only `viterbi.py` touches it, and it
# reads the package's SOURCE by AST rather than calling its API, so there is no
# typed surface to gain here.
[mypy-anipose.*]
ignore_missing_imports = True
